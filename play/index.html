<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#05070a">
    <title>HELM'S DEEP | Play</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/games/helmsdeep/helmsdeep.css?v=1">
    <style>
        html, body {
            margin: 0;
            min-height: 100%;
            background: #05070a;
            color: #e5e5e5;
            font-family: Inter, system-ui, sans-serif;
            overscroll-behavior: none;
        }

        .hd-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 18px;
            border-bottom: 1px solid #1d2430;
            background: rgba(8, 11, 16, .96);
        }

        .hd-bar h1 {
            margin: 0;
            font-family: Bangers, Impact, sans-serif;
            font-size: 1.35rem;
            letter-spacing: 2px;
            color: #fcd34d;
        }

        .hd-bar a {
            color: #9ae6ff;
            border: 1px solid rgba(74, 222, 255, .35);
            border-radius: 7px;
            padding: 5px 12px;
            font-size: .7rem;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .hd-bar a:hover { border-color: #4adeff; }
        .hd-bar .hd-note { color: #5d6b80; font-size: .72rem; margin-left: auto; }
        .hd-wrap { padding: 12px 18px 20px; }

        /* Phones and tablets: the game takes the whole viewport, the chrome goes
           away, and nothing may scroll or rubber-band under a thumb. */
        @media (pointer: coarse), (max-width: 900px) {
            html, body { height: 100%; overflow: hidden; touch-action: none; }
            .hd-bar { display: none; }
            .hd-wrap { padding: 0; }
            #helmsdeep-root > div { border-radius: 0; border: 0; }
            .h-\[calc\(100vh-118px\)\] { height: 100vh; height: 100dvh; }
            .min-h-\[640px\] { min-height: 0; }
        }
    </style>
</head>

<body>
    <div class="hd-bar">
        <h1>HELM'S DEEP</h1>
        <a href="/">← Home</a>
        <span class="hd-note">Real Mumbai, baked from OpenStreetMap. WASD drive · E steal · T transit map · M music · B next track · Esc pause</span>
    </div>
    <div class="hd-wrap">
        <div id="helmsdeep-root"></div>
        <pre id="hd-error"
            style="display:none; white-space:pre-wrap; color:#f87171; font:12px/1.5 monospace; padding:14px; border:1px solid #7f1d1d; border-radius:8px; background:rgba(60,8,8,.35);"></pre>
    </div>
    <script>
        // A bundling or asset failure otherwise shows as a blank page.
        window.addEventListener('error', function (e) {
            var el = document.getElementById('hd-error');
            el.style.display = 'block';
            el.textContent += 'ERROR: ' + e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + '\n';
        });
        window.addEventListener('unhandledrejection', function (e) {
            var el = document.getElementById('hd-error');
            el.style.display = 'block';
            el.textContent += 'PROMISE: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason) + '\n';
        });
    </script>
    <script src="/games/helmsdeep/session-tracker.js?v=7"></script>
    <script src="/games/helmsdeep/helmsdeep.js?v=7"></script>
    <script src="/games/helmsdeep/touch-controls.js?v=7"></script>
    <script src="/games/helmsdeep/spawn-select.js?v=7"></script>
</body>

</html>
