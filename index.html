<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELM'S DEEP | Top-Down Mumbai Action</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  
  <!-- Leaflet CSS & JS for Real-World Geographically Accurate Mumbai Map -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            mumbai: {
              taxi: '#F5B000',
              neon: '#FF0055',
              dark: '#080A0F',
              card: '#0F131C',
              border: '#1E2536'
            }
          },
          fontFamily: {
            arcade: ['"Press Start 2P"', 'monospace'],
            chakra: ['"Chakra Petch"', 'sans-serif'],
            sans: ['"Space Grotesk"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* Full height map & UI */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #080A0F;
    }
    #mumbaiMap {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      background: #080A0F;
    }
    /* CRT Scanline overlay */
    .crt-overlay::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
      z-index: 25;
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      opacity: 0.55;
    }
    /* Custom radar blip for Leaflet markers */
    .radar-blip {
      position: relative;
      width: 18px;
      height: 18px;
      background: #F5B000;
      border: 2px solid #000;
      border-radius: 50%;
      box-shadow: 0 0 10px #F5B000;
    }
    .radar-blip::after {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid rgba(245, 176, 0, 0.6);
      animation: pulseRadar 2s infinite ease-out;
    }
    @keyframes pulseRadar {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.8); opacity: 0; }
    }
    /* Transition flash */
    @keyframes gtaFlash {
      0% { opacity: 0; }
      40% { opacity: 0.95; }
      100% { opacity: 0; }
    }
    .animate-gta-flash {
      animation: gtaFlash 0.6s ease-out forwards;
    }
  </style>
</head>
<body class="bg-mumbai-dark text-slate-100 font-sans antialiased h-full overflow-hidden select-none">

  <!-- Main Container -->
  <div id="appContainer" class="crt-overlay relative w-full h-full flex flex-col bg-mumbai-dark">

    <!-- Minimal, High-Vibe Header -->
    <header class="absolute top-0 inset-x-0 z-30 px-6 py-4 flex items-center justify-between bg-gradient-to-b from-black/85 via-black/40 to-transparent pointer-events-none">
      <!-- Title: HELM'S DEEP -->
      <div class="flex items-center gap-3 pointer-events-auto">
        <div class="w-10 h-10 rounded bg-mumbai-taxi flex items-center justify-center font-arcade text-black font-black text-xs shadow-lg shadow-mumbai-taxi/30">
          HD
        </div>
        <div>
          <div class="font-chakra font-black text-xl sm:text-2xl tracking-wider text-white uppercase flex items-center gap-2">
            <span>HELM'S DEEP</span>
            <span class="text-[10px] font-arcade bg-mumbai-taxi/20 text-mumbai-taxi px-1.5 py-0.5 rounded border border-mumbai-taxi/40">MUMBAI</span>
          </div>
          <div class="text-[10px] font-chakra text-slate-400 tracking-widest uppercase -mt-0.5">Top-Down Urban Pursuit</div>
        </div>
      </div>

      <!-- Clean Audio Mute Control -->
      <div class="pointer-events-auto">
        <button id="toggleAudioBtn" type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-black/75 border border-slate-800 hover:border-mumbai-taxi/40 text-xs font-chakra text-slate-300 transition-colors">
          <span id="audioIcon">🔊</span>
          <span id="audioLabel">AUDIO</span>
        </button>
      </div>
    </header>

    <!-- White Flash Transition Overlay -->
    <div id="flashOverlay" class="pointer-events-none fixed inset-0 bg-white z-50 opacity-0 transition-opacity"></div>

    <!-- VIEW 1: ACCURATE REAL MUMBAI MAP & LOGIN -->
    <div id="landingView" class="relative w-full h-full flex items-center justify-center">
      
      <!-- Geographically Accurate Mumbai Map (ArcGIS World Dark Gray Canvas) -->
      <div id="mumbaiMap"></div>

      <!-- Vignette Gradient Overlay -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/60 pointer-events-none z-10"></div>

      <!-- FLOATING GTA LOGIN TERMINAL -->
      <div id="loginCard" class="relative z-20 w-full max-w-sm sm:max-w-md mx-4 p-6 sm:p-7 rounded-2xl bg-black/85 backdrop-blur-xl border border-mumbai-border shadow-2xl shadow-black transition-all duration-500">
        
        <div class="text-center mb-5">
          <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded bg-mumbai-taxi/10 border border-mumbai-taxi/30 text-[10px] font-chakra text-mumbai-taxi font-bold uppercase tracking-widest mb-2.5">
            <span class="w-1.5 h-1.5 rounded-full bg-mumbai-taxi animate-pulse"></span>
            HELM'S DEEP • TERMINAL LOGIN
          </div>
          <h1 class="text-2xl font-chakra font-black tracking-tight text-white uppercase">
            Enter Maximum City
          </h1>
          <p class="text-slate-400 text-xs mt-1 font-chakra">
            Choose your callsign and starting district to enter the streets.
          </p>
        </div>

        <form id="loginForm" class="space-y-4">
          <!-- Player id + PIN. Login is mandatory: it is how play time is counted. -->
          <div>
            <label for="playerAlias" class="block text-xs font-chakra font-bold text-slate-300 uppercase tracking-wider mb-1.5">
              Player ID
            </label>
            <div class="relative">
              <input type="text" id="playerAlias" required maxlength="16" autocomplete="username"
                     placeholder="rider_01" pattern="[A-Za-z0-9_]{3,16}"
                     class="w-full bg-slate-900/90 border border-slate-700 focus:border-mumbai-taxi focus:ring-1 focus:ring-mumbai-taxi rounded-xl px-4 py-3 text-sm font-chakra font-bold text-white placeholder-slate-500 transition-colors outline-none">
              <div class="absolute right-3.5 top-3.5 text-xs font-arcade text-mumbai-taxi">
                HD
              </div>
            </div>
            <p class="text-[11px] text-slate-500 font-chakra mt-1">3-16 characters: letters, numbers, underscore.</p>
          </div>

          <div>
            <label for="playerPin" class="block text-xs font-chakra font-bold text-slate-300 uppercase tracking-wider mb-1.5">
              PIN
            </label>
            <input type="password" id="playerPin" required minlength="4" maxlength="32" autocomplete="current-password"
                   placeholder="••••"
                   class="w-full bg-slate-900/90 border border-slate-700 focus:border-mumbai-taxi focus:ring-1 focus:ring-mumbai-taxi rounded-xl px-4 py-3 text-sm font-chakra font-bold text-white placeholder-slate-500 transition-colors outline-none">
          </div>

          <!-- District Spawn Selector (Moves real map camera!) -->
          <div>
            <label for="spawnDistrict" class="block text-xs font-chakra font-bold text-slate-300 uppercase tracking-wider mb-1.5">
              Spawn District (Accurate Map View)
            </label>
            <select id="spawnDistrict" class="w-full bg-slate-900/90 border border-slate-700 focus:border-mumbai-taxi focus:ring-1 focus:ring-mumbai-taxi rounded-xl px-4 py-3 text-sm font-chakra text-slate-200 transition-colors outline-none cursor-pointer">
              <optgroup label="Suburbs">
                <option value="bkc">Bandra Kurla Complex</option>
                <option value="airport">CSMIA Airport</option>
                <option value="juhu">Juhu Beach</option>
                <option value="bandra">Bandra West</option>
                <option value="kurla">Kurla Station</option>
                <option value="andheri">Andheri Metro</option>
              </optgroup>
              <optgroup label="East / Thane">
                <option value="powai">Powai Lake</option>
                <option value="ghatkopar">Ghatkopar</option>
                <option value="mulund">Mulund</option>
                <option value="thane">Thane Station</option>
              </optgroup>
              <optgroup label="South Mumbai">
                <option value="dadar">Dadar West</option>
                <option value="worli">Worli Sea Face</option>
                <option value="marine">Marine Drive</option>
                <option value="fort">CSMT &amp; Fort</option>
                <option value="colaba">Colaba Causeway</option>
              </optgroup>
            </select>
          </div>

          <!-- Start Game Button -->
          <button type="submit" id="startBtn"
                  class="w-full mt-2 py-3.5 px-6 rounded-xl bg-gradient-to-r from-mumbai-taxi to-amber-500 hover:from-yellow-400 hover:to-mumbai-taxi text-black font-chakra font-black text-sm tracking-wider uppercase transition-all shadow-lg shadow-mumbai-taxi/30 hover:shadow-mumbai-taxi/50 hover:scale-[1.02] flex items-center justify-center gap-2">
            <span>START HELM'S DEEP</span>
            <span class="text-xs">▶</span>
          </button>

          <!-- Second action: make the id instead of signing into it -->
          <button type="button" id="quickPlayBtn"
                  class="w-full py-2.5 px-4 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-xs font-chakra font-bold text-slate-300 hover:text-white transition-all flex items-center justify-center gap-1.5">
            <span>＋ Create this ID</span>
          </button>

          <p id="authMsg" class="text-[11px] font-chakra text-slate-400 min-h-[1rem] text-center"></p>
        </form>

        <div class="mt-5 pt-3 border-t border-slate-900 flex items-center justify-between text-[11px] font-chakra text-slate-500">
          <span>WANTED SYSTEM: ACTIVE</span>
          <span class="text-yellow-400 tracking-widest text-xs">★ ★ ★ ☆ ☆</span>
        </div>

      </div>

    </div>

  </div>

  <!-- SCRIPT -->
  <script>
    // --- 1. ACCURATE MUMBAI LEAFLET MAP INITIALIZATION ---
    let map = null;
    // These are the six districts the game itself can start you in, with the
    // coordinates it uses (see the `Dt` table in the game bundle). Keep the two
    // lists identical or the map camera and the spawn point disagree.
    const districtCoords = {
      bkc: { lat: 19.068, lng: 72.869, zoom: 14, name: "Bandra Kurla Complex" },
      airport: { lat: 19.0896, lng: 72.867, zoom: 14, name: "CSMIA Airport" },
      juhu: { lat: 19.098, lng: 72.826, zoom: 14, name: "Juhu Beach" },
      bandra: { lat: 19.055, lng: 72.834, zoom: 14, name: "Bandra West" },
      kurla: { lat: 19.065, lng: 72.879, zoom: 14, name: "Kurla Station" },
      andheri: { lat: 19.12, lng: 72.847, zoom: 14, name: "Andheri Metro" },
      dadar: { lat: 19.0239, lng: 72.8382, zoom: 14, name: "Dadar West" },
      worli: { lat: 19.0117, lng: 72.8179, zoom: 14, name: "Worli Sea Face" },
      marine: { lat: 18.9458, lng: 72.8237, zoom: 14, name: "Marine Drive" },
      fort: { lat: 18.9405, lng: 72.8358, zoom: 14, name: "CSMT & Fort" },
      colaba: { lat: 18.9151, lng: 72.826, zoom: 14, name: "Colaba Causeway" },
      powai: { lat: 19.1187, lng: 72.9073, zoom: 14, name: "Powai Lake" },
      ghatkopar: { lat: 19.0857, lng: 72.9084, zoom: 14, name: "Ghatkopar" },
      mulund: { lat: 19.1721, lng: 72.9567, zoom: 14, name: "Mulund" },
      thane: { lat: 19.1865, lng: 72.9758, zoom: 14, name: "Thane Station" }
    };

    function initMumbaiMap() {
      // Centred on the slice of Mumbai the game actually bakes: Bandra, BKC,
      // Kurla, Juhu and the airport.
      map = L.map('mumbaiMap', {
        center: [19.05, 72.89],
        zoom: 11,
        zoomControl: false,
        attributionControl: false
      });

      // ArcGIS World Dark Gray Base & Reference (Keyless, high-accuracy dark map)
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16
      }).addTo(map);

      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 16,
        opacity: 0.8
      }).addTo(map);

      // Custom Radar Blip Marker Icon
      const radarIcon = L.divIcon({
        className: 'radar-icon-container',
        html: '<div class="radar-blip"></div>',
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });

      // Place accurate real-world Mumbai markers
      Object.keys(districtCoords).forEach(key => {
        const item = districtCoords[key];
        const marker = L.marker([item.lat, item.lng], { icon: radarIcon }).addTo(map);
        marker.bindTooltip(`<b>${item.name}</b>`, {
          permanent: false,
          direction: 'top',
          className: 'bg-black text-white text-xs border border-slate-700 px-2 py-1 rounded font-sans'
        });
        marker.on('click', () => {
          document.getElementById('spawnDistrict').value = key;
          map.flyTo([item.lat, item.lng], item.zoom, { duration: 1.2 });
        });
      });
    }

    // Change district updates real map camera
    const spawnDistrictSelect = document.getElementById('spawnDistrict');
    spawnDistrictSelect.addEventListener('change', () => {
      const selected = spawnDistrictSelect.value;
      const target = districtCoords[selected];
      if (map && target) {
        map.flyTo([target.lat, target.lng], target.zoom, { duration: 1.5 });
      }
    });

    window.addEventListener('load', () => {
      initMumbaiMap();
    });

    // --- 2. AUDIO SYNTHESIS ENGINE ---
    let audioCtx = null;
    let audioMuted = false;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playHornSound() {
      if (audioMuted) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const notes = [392.00, 523.25, 659.25, 523.25];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(freq, now + idx * 0.07);
        gain.gain.setValueAtTime(0.12, now + idx * 0.07);
        gain.gain.exponentialRampToValueAtTime(0.001, now + (idx + 1) * 0.07);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.07);
        osc.stop(now + (idx + 1) * 0.07);
      });
    }

    function playStartTransitionSound() {
      if (audioMuted) return;
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;

      // Heavy engine ignition rumble
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(75, now);
      osc.frequency.exponentialRampToValueAtTime(300, now + 0.35);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.65);

      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.7);
    }

    const toggleAudioBtn = document.getElementById('toggleAudioBtn');
    const audioIcon = document.getElementById('audioIcon');
    const audioLabel = document.getElementById('audioLabel');

    toggleAudioBtn.addEventListener('click', () => {
      audioMuted = !audioMuted;
      if (audioMuted) {
        audioIcon.textContent = '🔇';
        audioLabel.textContent = 'MUTED';
        toggleAudioBtn.classList.add('text-slate-500');
      } else {
        audioIcon.textContent = '🔊';
        audioLabel.textContent = 'AUDIO';
        toggleAudioBtn.classList.remove('text-slate-500');
        playHornSound();
      }
    });

    // --- 3. LOGIN, THEN LAUNCH ---
    // Playing requires an id. It is the only way to know how many people played
    // and for how long; /play bounces anyone without a token straight back here.
    const AUTH_KEY = 'helmsdeep.auth';
    const landingView = document.getElementById('landingView');
    const flashOverlay = document.getElementById('flashOverlay');
    const loginForm = document.getElementById('loginForm');
    const quickPlayBtn = document.getElementById('quickPlayBtn');
    const playerAliasInput = document.getElementById('playerAlias');
    const playerPinInput = document.getElementById('playerPin');
    const authMsg = document.getElementById('authMsg');
    const startBtn = document.getElementById('startBtn');

    function savedAuth() {
      try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (err) { return null; }
    }

    // A returning player keeps their id in the field and skips the PIN.
    const known = savedAuth();
    if (known && known.id) {
      playerAliasInput.value = known.id;
      playerPinInput.required = false;
      authMsg.textContent = 'Signed in as ' + known.id + '. Press start.';
    }

    function say(text, bad) {
      authMsg.textContent = text;
      authMsg.className = 'text-[11px] font-chakra min-h-[1rem] text-center ' +
        (bad ? 'text-red-400' : 'text-slate-400');
    }

    async function authenticate(mode) {
      var id = playerAliasInput.value.trim().toLowerCase();
      var pin = playerPinInput.value;
      var current = savedAuth();
      if (current && current.id === id && mode === 'login' && !pin) return current;

      var res = await fetch('/api/account', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ mode: mode, id: id, pin: pin })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Sign in failed');
      var auth = { id: data.id, token: data.token };
      localStorage.setItem(AUTH_KEY, JSON.stringify(auth));
      return auth;
    }

    function launchHelmsDeep() {
      getAudioContext();
      playStartTransitionSound();

      // Cinematic camera zoom into selected map coordinates
      const selected = spawnDistrictSelect.value;
      const target = districtCoords[selected];
      if (map && target) {
        map.flyTo([target.lat, target.lng], 15, { duration: 0.6 });
      }

      // Flash & fade
      flashOverlay.classList.remove('opacity-0');
      flashOverlay.classList.add('animate-gta-flash');

      const loginCard = document.getElementById('loginCard');
      loginCard.style.transform = 'scale(0.85)';
      loginCard.style.opacity = '0';

      setTimeout(function () {
        window.location.href = '/play?spawn=' + encodeURIComponent(selected);
      }, 450);
    }

    async function run(mode, label) {
      startBtn.disabled = true;
      quickPlayBtn.disabled = true;
      say(label);
      try {
        await authenticate(mode);
        launchHelmsDeep();
      } catch (err) {
        say(err.message, true);
        startBtn.disabled = false;
        quickPlayBtn.disabled = false;
      }
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      run('login', 'Checking id…');
    });

    quickPlayBtn.addEventListener('click', () => {
      if (!loginForm.reportValidity()) return;
      run('signup', 'Creating id…');
    });

  </script>
</body>
</html>
